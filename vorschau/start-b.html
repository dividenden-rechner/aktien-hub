<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vorschau B</title><style>
:root{--g:#1a7a45;--g2:#2e9e5b;--l:#dff1e6;--t:#14231b}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;color:var(--t);background:#fff}
.bar{background:#fff7e0;font-size:13px;text-align:center;padding:6px}
header{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid #e6ece8;font-weight:700}
header b{color:var(--g)}
.hero{position:relative;overflow:hidden;padding:36px 16px 28px;max-width:1100px;margin:auto}
h1{font-size:clamp(30px,5.4vw,52px);line-height:1.08;margin:0 0 12px;letter-spacing:-.02em;position:relative;z-index:2}
h1 span{color:var(--g)}
p.sub{font-size:17px;color:#4a5a51;max-width:560px;margin:0 0 20px;position:relative;z-index:2}
.btn{display:inline-block;background:var(--g2);color:#fff;font-weight:700;padding:13px 22px;border-radius:8px;text-decoration:none;position:relative;z-index:2}
.btn2{margin-left:14px;color:var(--g);font-weight:700;text-decoration:none;position:relative;z-index:2}
.k{font-size:13px;color:#6a7a71;margin-top:14px;position:relative;z-index:2}
.cap{font-size:13px;color:#6a7a71}
</style></head><body><div class="bar">VORSCHAU Vorschlag B – Handy und Desktop</div><header>Dividenden-Rechner <b>Aktien-Hub</b></header><style>
.hero{display:grid;gap:8px}
.dev{position:relative;height:330px;margin-top:10px}
.lap{position:absolute;left:0;top:30px;width:86%;aspect-ratio:16/10;background:#fff;border:8px solid #1d2a23;border-radius:12px 12px 4px 4px;box-shadow:0 20px 40px #0002;overflow:hidden}.lap img,.ph img{display:block;width:100%;height:100%;object-fit:cover;object-position:center top}
.lap:after{content:"";position:absolute;left:-8%;right:-8%;bottom:-16px;height:8px;background:#c9d1cc;border-radius:0 0 12px 12px}
.ph{position:absolute;right:3%;top:6px;width:32%;aspect-ratio:9/18;background:#0b0f0d;border:5px solid #f1f3f2;border-radius:24px;transform:perspective(1100px) rotateY(-16deg) rotateX(3deg) rotateZ(11deg);box-shadow:1px 0 #d9dedb,2px 0 #d3d8d5,3px 0 #cdd2cf,4px 1px #c7ccc9,5px 1px #c1c6c3,6px 2px #bbc0bd,7px 2px #b5bab7,8px 3px #afb4b1,26px 30px 34px #0003}
.mini{display:flex;align-items:flex-end;gap:3px;height:60%;margin-top:8px}
.mini i{flex:1;background:#cfeadb;border-radius:2px 2px 0 0;animation:g 1.2s ease-out both}.mini i:last-child{background:var(--g2)}
@keyframes g{from{height:0}}
.row{display:flex;justify-content:space-between;border-bottom:1px solid #e8eee9;padding:3px 0}
.row b{color:var(--g)}
.ph img{border-radius:18px;border:3px solid #0b0f0d}.ph:after{content:"";position:absolute;left:50%;top:9px;width:7px;height:7px;margin-left:-3px;border-radius:50%;background:#0b0f0d;box-shadow:0 0 0 2px #1d2622}@media(min-width:760px){.hero{grid-template-columns:1.1fr 1fr;align-items:center;gap:40px;padding-top:60px}.dev{height:420px}}
</style><div class="hero"><div><h1>Dividenden-Rechner:<br>Vermögensaufbau mit <span>Aktien und ETFs</span></h1>
<p class="sub">Rechnen am Handy, prüfen am Desktop. Dein Plan ist überall derselbe.</p><a class="btn" href="#">Jetzt rechnen</a><a class="btn2" href="#">Aktie prüfen →</a><div class="k">Kostenlos · ohne Anmeldung</div></div>
<div class="dev"><div class="lap"><img src="../assets/start/rechner-desktop.jpg" alt="Dividenden-Rechner am Desktop"></div><div class="ph"><img src="../assets/start/rechner-handy-v2.jpg" alt="Dividenden-Rechner am Handy"></div></div></div></body></html>
