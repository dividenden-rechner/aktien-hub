<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vorschau A</title><style>
:root{--g:#1a7a45;--g2:#2e9e5b;--l:#dff1e6;--t:#14231b}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;color:var(--t);background:#fff}
.bar{background:#fff7e0;font-size:13px;text-align:center;padding:6px}
header{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid #e6ece8;font-weight:700}
header b{color:var(--g)}
.hero{position:relative;overflow:hidden;padding:36px 16px 28px;max-width:1100px;margin:auto}
h1{font-size:clamp(30px,5.4vw,52px);line-height:1.08;margin:0 0 12px;letter-spacing:-.02em;position:relative;z-index:2}
h1 span{color:var(--g)}
p.sub{font-size:17px;color:#4a5a51;max-width:560px;margin:0 0 20px;position:relative;z-index:2}
.btn{display:inline-block;background:var(--g2);color:#fff;font-weight:700;padding:13px 22px;border-radius:8px;text-decoration:none;position:relative;z-index:2}
.btn2{margin-left:14px;color:var(--g);font-weight:700;text-decoration:none;position:relative;z-index:2}
.k{font-size:13px;color:#6a7a71;margin-top:14px;position:relative;z-index:2}
.cap{font-size:13px;color:#6a7a71}
</style></head><body><div class="bar">VORSCHAU Vorschlag A – Wachsende Dividende</div><header>Dividenden-Rechner <b>Aktien-Hub</b></header><style>
.stairs{position:absolute;left:0;right:0;bottom:0;height:78%;display:flex;align-items:flex-end;gap:2.2%;padding:0 16px;z-index:1}
.stairs i{flex:1;background:linear-gradient(#cfeadb,#eaf6ef);border-radius:4px 4px 0 0;height:0;animation:up 1.4s cubic-bezier(.2,.8,.2,1) forwards}
.stairs i:after{content:"";display:block;height:34%;margin-top:auto}
@keyframes up{to{height:var(--h)}}
.hero{min-height:480px}
.num{position:absolute;right:22px;top:46%;z-index:2;text-align:right;font-variant-numeric:tabular-nums}
.num b{display:block;font-size:34px;color:var(--g)}.num small{color:#6a7a71}
@media(min-width:760px){.hero{min-height:520px}.num{top:56%;right:40px}.num b{font-size:48px}}
</style><div class="hero"><h1>Dividenden-Rechner:<br>Vermögensaufbau mit <span>Aktien und ETFs</span></h1>
<p class="sub">Sieh in Sekunden, wie aus Sparrate und Dividenden ein Vermögen wächst. Kostenlos, ohne Anmeldung.</p>
<a class="btn" href="#">Jetzt rechnen</a><a class="btn2" href="#">Aktie prüfen →</a>
<div class="stairs" id="st"></div><div class="num"><small>Dividende pro Jahr nach 20 Jahren</small><b id="n">0 €</b></div></div>
<script>const s=document.getElementById('st');for(let i=0;i<20;i++){const e=document.createElement('i');e.style.setProperty('--h',(8+Math.pow(i/19,2.2)*92)+'%');e.style.animationDelay=(i*.05)+'s';s.appendChild(e)}
let t=0;const n=document.getElementById('n');const f=setInterval(()=>{t+=.03;const v=Math.round(8144*(1-Math.pow(1-Math.min(t,1),3)));n.textContent=v.toLocaleString('de-DE')+' €';if(t>=1)clearInterval(f)},30)</script></body></html>
