name: SEC-Test (Fundamentaldaten)
on:
  push:
    branches: [main]
    paths:
      - "tools/sec_test.py"
      - ".github/workflows/sec-test.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 tools/sec_test.py
      - name: Ergebnis committen
        run: |
          git config user.name "sec-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/sec-test.json data/sec-test.md
          if git diff --cached --quiet; then echo "Keine Änderungen"; exit 0; fi
          git commit -m "SEC-Test: Abdeckung Fundamentaldaten"
          git pull --rebase -q
          git push
