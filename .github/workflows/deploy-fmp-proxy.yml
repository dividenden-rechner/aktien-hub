name: FMP-Zwischenserver bereitstellen
on:
  push:
    branches: [main]
    paths:
      - "worker/**"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fmp-proxy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Zugangsdaten pruefen
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Es fehlen die Secrets CLOUDFLARE_API_TOKEN und/oder CLOUDFLARE_ACCOUNT_ID (Settings > Secrets and variables > Actions)."
            exit 1
          fi
      - name: Worker hochladen
        run: npx --yes wrangler@3 deploy --config worker/wrangler.toml
      - name: FMP-Schluessel als Secret im Worker ablegen
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: |
          if [ -z "$FMP_API_KEY" ]; then echo "::error::Das GitHub-Secret FMP_API_KEY fehlt."; exit 1; fi
          printf '%s' "$FMP_API_KEY" | npx --yes wrangler@3 secret put FMP_API_KEY --config worker/wrangler.toml
