name: Probe ESEF-Berichte (Europa)
on:
  push:
    branches: [main]
    paths:
      - "tools/esef_probe.py"
      - ".github/workflows/esef-probe.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 tools/esef_probe.py
      - name: Ergebnis committen
        run: |
          git config user.name "esef-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/esef-probe.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Probe ESEF-Berichte"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
