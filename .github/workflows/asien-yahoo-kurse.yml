name: Asien-Kurse (Yahoo)
on:
  push:
    branches: [main]
    paths:
      - "tools/yahoo_asien_kurse.py"
      - ".github/workflows/asien-yahoo-kurse.yml"
  schedule:
    # 20:00 Berlin, 8 Uhr: zweimal, damit die Sommerzeit mit abgedeckt ist; der Lauf prueft die Ortszeit
    - cron: "0 6,7 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: asien-yahoo-kurse
jobs:
  laden:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Nur um 8 Uhr Berlin laufen (ausser manuell oder bei Aenderung)
        id: zeit
        run: |
          h=$(TZ=Europe/Berlin date +%H)
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$h" != "08" ]; then
            echo "skip=1" >> "$GITHUB_OUTPUT"; echo "Berlin $h Uhr, kein Lauf"
          else
            echo "skip=0" >> "$GITHUB_OUTPUT"
          fi
      - name: Kurse holen
        if: steps.zeit.outputs.skip == '0'
        run: python3 tools/yahoo_asien_kurse.py
      - name: Ergebnis committen
        if: steps.zeit.outputs.skip == '0'
        run: |
          git config user.name "kurse-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/asien-kurse-yahoo.json
          if git diff --cached --quiet; then echo "Keine Aenderung"; exit 0; fi
          git commit -m "Asien-Kurse (Yahoo)"
          for i in 1 2 3; do git pull --rebase --autostash -X theirs -q && git push && break; sleep 5; done
