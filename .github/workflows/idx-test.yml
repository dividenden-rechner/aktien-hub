name: IDX Test (Jakarta)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: GetFinancialReport für BBCA abfragen
        run: |
          UA="Mozilla/5.0 (dividenden-rechner.de Datensammlung)"
          for base in "https://www.idx.co.id/primary/ListedCompany/GetFinancialReport" "https://www.idx.id/primary/ListedCompany/GetFinancialReport"; do
            for q in "indexFrom=0&pageSize=12&year=2025&reportType=rdf&periode=audit&kodeEmiten=BBCA&SortColumn=KodeEmiten&SortOrder=asc" "indexFrom=0&pageSize=12&year=2025&reportType=rdf&periode=tahunan&kodeEmiten=BBCA&SortColumn=KodeEmiten&SortOrder=asc"; do
              echo "== $base?$q"
              curl -s -L -A "$UA" -H "Accept: application/json" -m 40 -o /tmp/fr.json -w "HTTP %{http_code} %{size_download}\n" "$base?$q"
              head -c 900 /tmp/fr.json; echo
            done
          done
