name: IDX Test (Jakarta)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Jahresabschluss-Seite und Datenquelle finden
        run: |
          UA="Mozilla/5.0 (dividenden-rechner.de Datensammlung)"
          curl -s -L -A "$UA" -m 40 -o /tmp/fs.html -w "HTTP %{http_code} %{size_download}\n" "https://www.idx.id/en/listed-companies/financial-statements-and-annual-report/"
          echo "== Links auf der Seite (Auszug)"
          grep -oi 'href="[^"]*"' /tmp/fs.html | grep -i "financ\|report\|xbrl\|api\|\.pdf\|\.zip\|\.xlsx\|laporan" | sort -u | head -40
          echo "== API-Adressen in Skripten"
          grep -oi 'https\?://[^"'"'"' )]*\(api\|json\|xbrl\|financ\|report\)[^"'"'"' )]*' /tmp/fs.html | sort -u | head -40
          echo "== Relative API-Pfade"
          grep -oi '"/\(api\|primary\|_nuxt\)[^"]*"' /tmp/fs.html | sort -u | head -20
          echo "== Nuxt-Daten (Ausschnitt)"
          grep -o '__NUXT__[^<]\{0,300\}' /tmp/fs.html | head -c 800; echo
