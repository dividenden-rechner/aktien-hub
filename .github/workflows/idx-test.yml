name: IDX Test (Jakarta)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: API-Endpunkte in den Skripten finden
        run: |
          UA="Mozilla/5.0 (dividenden-rechner.de Datensammlung)"
          curl -s -L -A "$UA" -m 40 -o /tmp/fs.html "https://www.idx.id/en/listed-companies/financial-statements-and-annual-report/"
          mkdir -p /tmp/js && cd /tmp/js
          for s in $(grep -oi '/_nuxt/[^"]*\.js' /tmp/fs.html | sort -u); do
            curl -s -L -A "$UA" -m 40 -o "$(basename $s)" "https://www.idx.id$s"
          done
          echo "Skripte: $(ls | wc -l)"
          echo "== API-Adressen"
          grep -oh 'https\?://[a-zA-Z0-9./_-]*' *.js | grep -i "idx\|api" | sort | uniq -c | sort -rn | head -20
          echo "== Pfade mit api/primary/financial"
          grep -oh '"/\(api\|primary\|financ\|report\|xbrl\)[^"]\{0,120\}"' *.js | sort -u | head -40
          echo "== Umfeld 'financial-statement' in Skripten"
          grep -oh '.\{0,120\}financial-statement.\{0,120\}' *.js | head -10
