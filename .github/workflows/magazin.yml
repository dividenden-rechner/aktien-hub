name: Magazin bauen
on:
  push:
    branches: [main]
    paths:
      - "content/magazin/**"
      - "tools/build_magazin.py"
      - "tools/fetch_logos.py"
      - "tools/site.json"
      - "assets/magazin/**"
  schedule:
    - cron: "17 5 * * *"   # täglich: Artikel mit Datum in der Zukunft werden automatisch freigeschaltet
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: magazin
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install markdown pillow
      - name: Firmenlogos holen
        run: python3 tools/fetch_logos.py
      - run: python3 tools/build_magazin.py
      - name: Änderungen committen
        run: |
          git config user.name "magazin-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Keine Änderungen"; exit 0; fi
          git commit -m "Magazin gebaut"
          git pull --rebase -q
          git push
