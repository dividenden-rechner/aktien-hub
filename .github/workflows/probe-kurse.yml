name: Probe Kursquellen
on:
  push:
    branches: [main]
    paths:
      - "tools/probe_kurse.py"
      - ".github/workflows/probe-kurse.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: probe-kurse
jobs:
  laden:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Quellen pruefen
        
        run: python3 tools/probe_kurse.py

