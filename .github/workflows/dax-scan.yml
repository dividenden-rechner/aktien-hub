name: DAX IR-Seiten durchsuchen
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/dax.trigger"
permissions:
  contents: write
concurrency:
  group: magazin
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Suchen
        run: python3 tools/dax_scan.py
      - name: Ergebnis committen
        run: |
          git config user.name "asset-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/dax-ir-scan.json docs/DAX-IR-QUELLEN.md
          if git diff --cached --quiet; then echo "Keine Aenderungen"; exit 0; fi
          git commit -m "DAX IR-Scan"
          git pull --rebase -q
          git push
