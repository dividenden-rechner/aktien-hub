name: BDC-Test (SEC-Daten)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 tools/bdc_test.py
      - name: Ergebnis committen
        run: |
          git config user.name "bdc-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/bdc-test.json data/bdc-test.md
          if git diff --cached --quiet; then echo "Keine Änderungen"; exit 0; fi
          git commit -m "BDC-Test: SEC-Abdeckung"
          git pull --rebase -q
          git push
