name: IR-Agent (Bericht zu Entwurf)
on:
  push:
    branches: [main]
    paths:
      - "content/ir-inbox/*.pdf"
  workflow_dispatch:
    inputs:
      ticker:
        description: "US-Kürzel, z. B. KO oder O (mehrere mit Komma: KO,PEP). Der Bericht wird automatisch von der SEC geholt."
        required: false
      pdf_url:
        description: "Oder: direkter Link zu einer PDF (für Titel außerhalb der USA)"
        required: false
permissions:
  contents: write
concurrency:
  group: ir-agent
  cancel-in-progress: false
jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils fonts-dejavu-core
      - name: Quellen bestimmen
        env:
          TICKERS: ${{ github.event.inputs.ticker }}
          PDF_URL: ${{ github.event.inputs.pdf_url }}
        run: |
          mkdir -p content/ir-inbox
          : > /tmp/todo.txt
          if [ -n "$TICKERS" ]; then
            echo "$TICKERS" | tr ',' '\n' | tr -d ' ' | sed '/^$/d' | sed 's/^/ticker:/' >> /tmp/todo.txt
          fi
          if [ -n "$PDF_URL" ]; then
            curl -fsSL -A "Mozilla/5.0" -o content/ir-inbox/download.pdf "$PDF_URL"
            echo "content/ir-inbox/download.pdf" >> /tmp/todo.txt
          fi
          if [ ! -s /tmp/todo.txt ]; then
            git diff --name-only --diff-filter=AM HEAD~1 HEAD -- 'content/ir-inbox/*.pdf' > /tmp/todo.txt || true
          fi
          cat /tmp/todo.txt
      - name: Entwuerfe erzeugen
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
        run: |
          while read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              ticker:*) python3 tools/ir_agent.py --ticker "${f#ticker:}" ;;
              *) python3 tools/ir_agent.py "$f" ;;
            esac
          done < /tmp/todo.txt
      - name: Committen
        run: |
          rm -f content/ir-inbox/download.pdf
          git config user.name "ir-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Keine Änderungen"; exit 0; fi
          git commit -m "IR-Agent: Entwurf erzeugt"
          git pull --rebase -q
          git push
