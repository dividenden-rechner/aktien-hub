name: IR-Agent (Bericht zu Entwurf)
on:
  push:
    branches: [main]
    paths:
      - "content/ir-inbox/*.pdf"
  workflow_dispatch:
    inputs:
      pdf_url:
        description: "Direkter Link zu einer PDF (optional; sonst werden neue PDFs aus content/ir-inbox verarbeitet)"
        required: false
permissions:
  contents: write
concurrency:
  group: ir-agent
  cancel-in-progress: false
jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils fonts-dejavu-core
      - name: PDFs bestimmen
        run: |
          mkdir -p content/ir-inbox
          if [ -n "${{ github.event.inputs.pdf_url }}" ]; then
            curl -fsSL -A "Mozilla/5.0" -o content/ir-inbox/download.pdf "${{ github.event.inputs.pdf_url }}"
            echo "content/ir-inbox/download.pdf" > /tmp/todo.txt
          else
            git diff --name-only --diff-filter=AM HEAD~1 HEAD -- 'content/ir-inbox/*.pdf' > /tmp/todo.txt || true
          fi
          cat /tmp/todo.txt
      - name: Entwuerfe erzeugen
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          while read -r f; do [ -n "$f" ] && python3 tools/ir_agent.py "$f"; done < /tmp/todo.txt
      - name: Committen
        run: |
          rm -f content/ir-inbox/download.pdf
          git config user.name "ir-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Keine Änderungen"; exit 0; fi
          git commit -m "IR-Agent: Entwurf erzeugt"
          git pull --rebase -q
          git push
