name: GPT-Daten (Fundamentaldaten per OpenAI sammeln)
on:
  workflow_dispatch:
    inputs:
      firmen:
        description: "SYMBOL=Name;SYMBOL=Name"
        required: true
      modell:
        description: "OpenAI-Modell"
        default: "gpt-5.5"
concurrency:
  group: gpt-daten
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  sammeln:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Daten sammeln
        env:
          CHAT_API_KEY: ${{ secrets.CHAT_API_KEY }}
          FIRMEN: ${{ inputs.firmen }}
          MODELL: ${{ inputs.modell }}
        run: python3 tools/gpt_daten.py
      - name: Ergebnis committen
        run: |
          git config user.name "gpt-daten-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/gpt
          if git diff --cached --quiet; then echo "Nichts Neues"; exit 0; fi
          git commit -m "GPT-Daten: Rohstand"
          for i in 1 2 3; do git pull --rebase -X theirs -q && git push && break; sleep 5; done
