name: NSM-Test (britische Meldungen)
on:
  push:
    branches: [main]
    paths:
      - "tools/nsm.trigger"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: nsm
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 tools/nsm_probe.py
      - name: Speichern
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A data/
          git diff --cached --quiet || git commit -m "NSM-Test: Rohantworten"
          git pull --rebase -q || true
          git push
