name: Startseiten-Kacheln
on:
  schedule:
    - cron: "30 5 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  kacheln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow markdown
      - name: Kacheln mit echten Zahlen
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: python3 tools/kacheln.py
      - name: Committen
        run: |
          git config user.name "kachel-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Keine Änderungen"; exit 0; fi
          git commit -m "Startseite: Kacheln mit aktuellen Zahlen"
          git pull --rebase -q
          git push
