name: Japan und Korea - Gewinn und Dividende je Aktie

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: asien-fundamente

jobs:
  laden:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Berichte lesen (EDINET Japan, DART Korea)
        env:
          EDINET_API_KEY: ${{ secrets.EDINET_API_KEY }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python3 tools/asien_fundamente.py
      - name: Ergebnis committen
        run: |
          git config user.name "kurse-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/asien-fundamente.json
          if git diff --cached --quiet; then echo "Keine Aenderung"; exit 0; fi
          git commit -m "Japan und Korea: Gewinn und Dividende je Aktie"
          for i in 1 2 3; do git pull --rebase -X theirs -q && git push && break; sleep 5; done
