name: Ausweichanbieter testen
# Einmal-Test von Groq (Texte) und Tavily (Recherche) mit den Secrets GROQ_API_KEY und TAVILY_API_KEY. Ergebnis steht im Protokoll.
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - name: Testen
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: python3 tools/ausweich_test.py
