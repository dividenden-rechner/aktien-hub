name: Feeds suchen (Asien und Europa)
on:
  push:
    branches: [main]
    paths:
      - "tools/asia.trigger"
      - "tools/europa.trigger"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: magazin
  cancel-in-progress: false
jobs:
  suchen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Feeds suchen
        run: |
          python3 tools/find_asia_feeds.py asia
          python3 tools/find_asia_feeds.py europa
      - name: Speichern
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A data/
          git diff --cached --quiet || git commit -m "Asien: IR-Seiten und Feeds gefunden"
          git pull --rebase -q || true
          git push
