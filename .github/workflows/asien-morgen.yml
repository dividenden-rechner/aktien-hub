name: Asien-Morgenbriefing
on:
  schedule:
    - cron: "0 4 * * 1-5"   # 04:00 UTC = 06:00 Sommerzeit
    - cron: "0 5 * * 1-5"   # 05:00 UTC = 06:00 Winterzeit (der Lauf prueft die Ortszeit)
  push:
    branches: [main]
    paths:
      - "tools/asien.trigger"
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: ir-agent
  cancel-in-progress: false
jobs:
  briefing:
    runs-on: ubuntu-latest
    steps:
      - name: Nur um 6 Uhr deutscher Zeit laufen (Zeitplan), Test sofort
        id: zeit
        run: |
          H=$(TZ=Europe/Berlin date +%H)
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$H" != "06" ] && [ "$H" != "07" ]; then echo "skip=1" >> $GITHUB_OUTPUT; fi
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.event.schedule }}" = "0 4 * * 1-5" ] && [ "$H" = "05" ]; then echo "skip=1" >> $GITHUB_OUTPUT; fi
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.event.schedule }}" = "0 5 * * 1-5" ] && [ "$H" = "07" ]; then echo "skip=1" >> $GITHUB_OUTPUT; fi
      - uses: actions/checkout@v4
        if: steps.zeit.outputs.skip != '1'
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        if: steps.zeit.outputs.skip != '1'
        with:
          python-version: "3.12"
      - if: steps.zeit.outputs.skip != '1'
        run: pip install pillow markdown
      - name: Briefing erzeugen
        if: steps.zeit.outputs.skip != '1'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: python3 tools/asien_morgen.py
      - name: Entwuerfe als Pull Requests zur Freigabe anlegen
        if: steps.zeit.outputs.skip != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/draft_prs.py
      - name: Committen
        if: steps.zeit.outputs.skip != '1'
        run: |
          git config user.name "ir-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Keine Änderungen"; exit 0; fi
          git commit -m "Asien-Morgenbriefing: Feed-Status"
          git pull --rebase -q
          git push
