name: Asien-Morgenbriefing
on:
  schedule:
    - cron: "0 4,5 * * 1-5"    # 06:00 deutsche Zeit (Sommer/Winter), der Lauf prueft die Ortszeit
    - cron: "15 7,8 * * 1-5"   # 09:15 deutsche Zeit: zweiter Versuch, falls das Gemini-Tageskontingent um 06:00 noch leer war (es wird um 09:00 erneuert)
  push:
    branches: [main]
    paths:
      - "tools/asien.trigger"
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: ir-agent
  cancel-in-progress: false
jobs:
  briefing:
    runs-on: ubuntu-latest
    steps:
      - name: Nur um 6 und 9 Uhr deutscher Zeit laufen (Zeitplan), Test sofort
        id: zeit
        run: |
          H=$(TZ=Europe/Berlin date +%H)
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$H" != "06" ] && [ "$H" != "09" ]; then echo "skip=1" >> $GITHUB_OUTPUT; fi
      - uses: actions/checkout@v4
        if: steps.zeit.outputs.skip != '1'
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        if: steps.zeit.outputs.skip != '1'
        with:
          python-version: "3.12"
      - if: steps.zeit.outputs.skip != '1'
        run: pip install pillow markdown
      - name: Briefing erzeugen
        if: steps.zeit.outputs.skip != '1'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then python3 tools/asien_morgen.py --nur-wenn-noetig; else python3 tools/asien_morgen.py; fi
      - name: Entwuerfe als Pull Requests zur Freigabe anlegen
        if: steps.zeit.outputs.skip != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/draft_prs.py
      - name: Committen
        if: steps.zeit.outputs.skip != '1'
        run: |
          git config user.name "ir-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Keine Änderungen"; exit 0; fi
          git commit -m "Asien-Morgenbriefing: Feed-Status"
          git pull --rebase -q
          git push
