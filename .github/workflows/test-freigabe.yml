name: Test der Freigabe-Meldung
on:
  push:
    branches: [main]
    paths:
      - "tools/test-freigabe.trigger"
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test-Entwurf anlegen und als Pull Request einreichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          d=$(date +%Y-%m-%d-%H%M)
          cat > "content/magazin/$d-testmeldung-freigabe.md" <<'EOF'
          ---
          title: "Testmeldung: So sieht eine Freigabe aus"
          description: "Nur ein Test der Push-Meldung. Bitte den Pull Request schließen, nicht mergen."
          date: 2026-10-29 23:30
          category: Sonstige Meldung
          typ: kurz
          draft: true
          ---
          Dies ist ein Test der Freigabe-Meldung. Bitte **Close** tippen und nicht mergen.
          EOF
          sed -i 's/^          //' "content/magazin/$d-testmeldung-freigabe.md"
          python3 tools/draft_prs.py
