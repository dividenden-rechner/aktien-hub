name: Chat-Key-Test
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Anbieter erkennen und Modelle abfragen
        env:
          K: ${{ secrets.CHAT_API_KEY }}
        run: |
          python3 - <<'PY'
          import os, json, urllib.request, urllib.error
          k = os.environ.get("K", "").strip()
          if not k:
              print("ERGEBNIS: Secret CHAT_API_KEY ist leer oder fehlt"); raise SystemExit(0)
          print("Laenge:", len(k))
          P = [("sk-ant-", "Anthropic", "https://api.anthropic.com/v1/models", {"x-api-key": k, "anthropic-version": "2023-06-01"}),
               ("sk-or-", "OpenRouter", "https://openrouter.ai/api/v1/key", {"Authorization": "Bearer " + k}),
               ("gsk_", "Groq", "https://api.groq.com/openai/v1/models", {"Authorization": "Bearer " + k}),
               ("xai-", "xAI", "https://api.x.ai/v1/models", {"Authorization": "Bearer " + k}),
               ("pplx-", "Perplexity", None, {}),
               ("AIza", "Google Gemini", "https://generativelanguage.googleapis.com/v1beta/models", {"x-goog-api-key": k}),
               ("sk-proj-", "OpenAI", "https://api.openai.com/v1/models", {"Authorization": "Bearer " + k}),
               ("sk-svcacct-", "OpenAI", "https://api.openai.com/v1/models", {"Authorization": "Bearer " + k})]
          hit = next((p for p in P if k.startswith(p[0])), None)
          if not hit:
              art = "sk-" if k.startswith("sk-") else "unbekannt"
              print("ERGEBNIS: Anbieter nicht eindeutig, Praefix-Art:", art); raise SystemExit(0)
          print("ERGEBNIS: Anbieter", hit[1])
          if hit[2]:
              try:
                  r = urllib.request.urlopen(urllib.request.Request(hit[2], headers=hit[3]), timeout=30)
                  d = json.load(r)
                  ids = [m.get("id") or m.get("name") for m in d.get("data", d.get("models", []))] if isinstance(d.get("data", d.get("models")), list) else []
                  print("Status 200, Modelle:", len(ids)); print(", ".join(sorted(map(str, ids))[:80]))
              except urllib.error.HTTPError as e:
                  print("Status", e.code, e.read()[:200].decode("utf-8", "replace"))
          PY
