name: Asien - Unternehmensuniversum (Ticker, Kennungen, Berichtsquellen)

# Laedt offizielle, kostenlose Wertpapierlisten (HKEX, SGX, CNINFO, JPX, EDINET) neu,
# ordnet die 451 Eintraege zu und sucht Jahresberichts-Kandidaten 2016-2025 (HKEXnews, CNINFO).
# Mit DART_API_KEY/EDINET_API_KEY: Korea-Ticker pruefen, Geschaeftsberichte KR/JP 2016-2025 auflisten.
# Es werden keine Finanzzahlen erzeugt und nichts als "verified" markiert.

on:
  schedule:
    - cron: "29 3 3 * *"   # monatlich: neue Jahresberichte (Japan Ende Juni, Korea März, HK/CN/SG Frühjahr) finden
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: asien-universum

jobs:
  aktualisieren:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    defaults:
      run:
        working-directory: asia-equity-hub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: asia-equity-hub/requirements.txt
      - run: pip install -r requirements.txt
      - name: Offizielle Listen laden und zuordnen
        run: python build_identity_map.py --download
      - name: Berichtsquellen suchen (HKEXnews, CNINFO)
        run: python build_report_sources.py
      - name: Korea (OpenDART) und Japan (EDINET) - braucht die vorhandenen Secrets
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          EDINET_API_KEY: ${{ secrets.EDINET_API_KEY }}
        run: python build_regulator_sources.py
      - name: Tests
        run: python -m pytest -q
      - name: Ergebnis committen
        working-directory: .
        run: |
          git config user.name "kurse-bot"
          git config user.email "actions@users.noreply.github.com"
          git add asia-equity-hub/reports/universe/identity_map.json asia-equity-hub/reports/sources/annual_report_sources.json
          if git diff --cached --quiet; then echo "Keine Aenderung"; exit 0; fi
          git commit -m "Asien: Unternehmensuniversum und Berichtsquellen aktualisiert"
          for i in 1 2 3; do git pull --rebase --autostash -X theirs -q && git push && break; sleep 5; done
