name: Newsletter-Zwischenserver bereitstellen
on:
  push:
    branches: [main]
    paths:
      - "worker-newsletter/**"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: newsletter
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Zugangsdaten pruefen
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then echo "::error::Cloudflare-Secrets fehlen."; exit 1; fi
          if [ -z "$BREVO_API_KEY" ]; then echo "::error::Das GitHub-Secret BREVO_API_KEY fehlt."; exit 1; fi
      - name: Worker hochladen
        run: npx --yes wrangler@3 deploy --config worker-newsletter/wrangler.toml
      - name: Brevo-Schluessel als Secret im Worker ablegen
        run: printf '%s' "$BREVO_API_KEY" | npx --yes wrangler@3 secret put BREVO_API_KEY --config worker-newsletter/wrangler.toml
