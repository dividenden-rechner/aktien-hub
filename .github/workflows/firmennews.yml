name: Firmen-Nachrichten
on:
  schedule:
    - cron: "40 6 * * *"
  workflow_dispatch:
    inputs:
      nur:
        description: "Nur diese Kuerzel, durch Komma getrennt (leer = alle)"
        required: false
        default: ""
permissions:
  contents: write
jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Logos speichern
        run: python tools/hub_logos.py
      - name: Firmen-Meldungen abrufen
        env:
          NUR: ${{ github.event.inputs.nur }}
        run: python tools/firmennews.py --nur "$NUR"
      - name: Speichern
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add data/firmennews assets/logos/hub
          git diff --cached --quiet || (git commit -qm "Firmen-Nachrichten aktualisiert" && git pull -q --rebase && git push -q)
