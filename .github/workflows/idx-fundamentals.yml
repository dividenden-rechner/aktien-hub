name: IDX-Jahreszahlen Indonesien
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  laden:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 tools/idx_fundamentals.py
      - name: Ergebnis committen
        run: |
          git config user.name "idx-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/idx
          if git diff --cached --quiet; then echo "Keine Änderungen"; exit 0; fi
          git commit -m "IDX-Jahreszahlen Indonesien aktualisiert"
          git push
