name: AV-Earnings (Termine, Schaetzungen, Ist-Zahlen)
on:
  schedule:
    - cron: "40 5 * * *"    # morgens: Kalender + 10 Schaetzungen
    - cron: "40 22 * * 1-5" # nachts: bis zu 10 Ergebnisse (AV hinkt teils bis zum naechsten Tag nach)
  workflow_dispatch:
    inputs:
      phase:
        description: "vorschau oder ergebnisse (leer = nach Uhrzeit)"
        required: false
permissions:
  contents: write
concurrency:
  group: av-earnings
  cancel-in-progress: false
jobs:
  av:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Alpha Vantage abrufen
        env:
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
          AV_PHASE: ${{ github.event.inputs.phase }}
        run: python3 tools/av_earnings.py
      - name: Committen
        run: |
          git config user.name "av-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data/
          if git diff --cached --quiet; then echo "Keine Aenderungen"; exit 0; fi
          git commit -m "AV-Earnings: Termine und Zahlen aktualisiert"
          git pull --rebase -q
          git push
