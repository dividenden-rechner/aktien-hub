name: IDX Dividenden-Probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Dividend-Endpunkte testen
        run: |
          UA="Mozilla/5.0 (dividenden-rechner.de Datensammlung)"
          mkdir -p js && cd js
          curl -s -L -A "$UA" -m 40 -o ../profil.html "https://www.idx.id/en/listed-companies/company-profiles/BBCA"
          for s in $(grep -oi '/_nuxt/[^"]*\.js' ../profil.html | sort -u); do curl -s -L -A "$UA" -m 40 -o "$(basename $s)" "https://www.idx.id$s"; done
          cat *.js > /tmp/alles.txt
          echo "== Kontext GetDividenTunai / GetDividenSaham"
          grep -oh '.\{0,300\}GetDividen\(Tunai\|Saham\).\{0,300\}' /tmp/alles.txt | head -6
          echo "== Kontext DividendTab"
          grep -oh '.\{0,200\}dividendData.\{0,200\}' /tmp/alles.txt | head -4
          cd ..
          REF="https://www.idx.id/en/listed-companies/company-profiles/BBCA"
          for y in 2019 2020 2021 2022 2023 2024 2025 2026; do
            for k in BBCA BBRI TLKM; do
              curl -s -A "$UA" -e "$REF" -H "Accept: application/json, text/plain, */*" -m 40 -o r.json "https://www.idx.id/primary/ListedCompany/GetDividenTunai?KodeEmiten=$k&Year=$y"
              echo "$k $y $(head -c 200 r.json)"
            done
          done
          echo "-- ohne Jahr"
          curl -s -A "$UA" -e "$REF" -H "Accept: application/json" -m 40 -o r.json "https://www.idx.id/primary/ListedCompany/GetDividenTunai?KodeEmiten=BBCA"; head -c 400 r.json; echo
          echo "-- Saham ohne Jahr"
          curl -s -A "$UA" -e "$REF" -H "Accept: application/json" -m 40 -o r.json "https://www.idx.id/primary/ListedCompany/GetDividenSaham?KodeEmiten=BBCA"; head -c 400 r.json; echo
