name: IDX Dividenden-Probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Dividend-Endpunkte testen
        run: |
          UA="Mozilla/5.0 (dividenden-rechner.de Datensammlung)"
          mkdir -p js && cd js
          curl -s -L -A "$UA" -m 40 -o ../profil.html "https://www.idx.id/en/listed-companies/company-profiles/BBCA"
          for s in $(grep -oi '/_nuxt/[^"]*\.js' ../profil.html | sort -u); do curl -s -L -A "$UA" -m 40 -o "$(basename $s)" "https://www.idx.id$s"; done
          cat *.js > /tmp/alles.txt
          echo "== Kontext GetDividenTunai / GetDividenSaham"
          grep -oh '.\{0,300\}GetDividen\(Tunai\|Saham\).\{0,300\}' /tmp/alles.txt | head -6
          echo "== Kontext DividendTab"
          grep -oh '.\{0,200\}dividendData.\{0,200\}' /tmp/alles.txt | head -4
          cd ..
          for p in "/primary/ListedCompany/GetDividenTunai?kodeEmiten=BBCA" "/primary/ListedCompany/GetDividenTunai?kodeEmiten=BBCA&start=0&length=20" "/primary/ListedCompany/GetDividenSaham?kodeEmiten=BBCA" "/primary/ListedCompany/GetDividenTunai?KodeEmiten=BBCA&start=0&length=20"; do
            echo "-- $p"
            curl -s -A "$UA" -H "Accept: application/json, text/plain, */*" -m 40 -o r.json -w "HTTP %{http_code} %{size_download}\n" "https://www.idx.id$p"
            head -c 700 r.json; echo
          done
