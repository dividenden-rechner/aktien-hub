name: EZB-Wechselkurse
on:
  push:
    branches: [main]
    paths:
      - "tools/ecb_wechselkurse.py"
      - ".github/workflows/ecb-wechselkurse.yml"
  schedule:
    # 17:00 Berlin (EZB veroeffentlicht ca. 16:00 CET), zweimal wegen Sommerzeit
    - cron: "0 15,16 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ecb-wechselkurse
jobs:
  laden:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Nur um 17 Uhr Berlin laufen (ausser manuell oder bei Aenderung)
        id: zeit
        run: |
          h=$(TZ=Europe/Berlin date +%H)
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$h" != "17" ]; then
            echo "skip=1" >> "$GITHUB_OUTPUT"
          else
            echo "skip=0" >> "$GITHUB_OUTPUT"
          fi
      - name: EZB-Kurse holen
        if: steps.zeit.outputs.skip == '0'
        run: python3 tools/ecb_wechselkurse.py
      - name: Ergebnis committen
        if: steps.zeit.outputs.skip == '0'
        run: |
          git config user.name "kurse-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/wechselkurse-ezb.json
          if git diff --cached --quiet; then echo "Keine Aenderung"; exit 0; fi
          git commit -m "EZB-Wechselkurse"
          for i in 1 2 3; do git pull --rebase --autostash -X theirs -q && git push && break; sleep 5; done
