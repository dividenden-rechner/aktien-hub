name: Asien - Geschaeftsberichte pruefen (HK, SG, CN)

# Vorlage fuer dividenden-rechner/aktien-hub. Erwartet das Projekt im Unterordner
# asia-equity-hub/ und schreibt data/asien-geschaeftsberichte.json (gleiches Schema-
# Prinzip wie data/asien-fundamente.json). Nur kostenlose, offizielle Quellen.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: asien-geschaeftsberichte

jobs:
  laden:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: asia-equity-hub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: asia-equity-hub/requirements.txt
      - run: pip install -r requirements.txt
      - name: Tests (offline)
        run: python -m pytest -q
      - name: PDFs laden (Pruefsummen aus reports/catalog.json)
        run: python process_reports.py --download > import-result.json
      - name: Werte extrahieren und pruefen (bricht bei Inkonsistenz ab)
        run: python extract_reports.py
      - name: Zehnjahreshistorie 2016-2025 (CKH, Swire, First Pacific)
        run: python build_ten_year_history.py
      - name: Export fuer die Website
        run: python export_aktien_hub.py --out ../data/asien-geschaeftsberichte.json
      - name: Asien-Jahreszahlen fuer den Aktien-Hub
        working-directory: .
        run: python3 tools/build_asien_fundamentals.py
      - name: Ergebnis committen
        working-directory: .
        run: |
          git config user.name "kurse-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/asien-geschaeftsberichte.json data/asien/fundamentals.json asia-equity-hub/reports/extracted asia-equity-hub/reports/history
          if git diff --cached --quiet; then echo "Keine Aenderung"; exit 0; fi
          git commit -m "Asien: Geschaeftsberichte HK/SG/CN geprueft"
          for i in 1 2 3; do git pull --rebase --autostash -X theirs -q && git push && break; sleep 5; done
