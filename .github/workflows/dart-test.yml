name: DART-Test (Korea, Quartalsgewinn)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: DART-Test laufen lassen
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python tools/dart_test.py
      - name: Ergebnis committen
        run: |
          git config user.name "aktien-hub-bot"
          git config user.email "bot@dividenden-rechner.de"
          git add data/dart-test.json
          git commit -m "DART-Test: Ergebnis" || exit 0
          for i in 1 2 3 4 5; do git pull -q --rebase && git push -q && break; sleep 5; done
